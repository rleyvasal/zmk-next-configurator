name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zmk-next-configurator
      - uses: actions/checkout@v4
        with:
          repository: rleyvasal/zmk-next-messages
          path: zmk-next-messages
          # The protocol revision zmk-next's app/west.yml pins.
          ref: 763e8572616b17678f6f3a46c169a2a9baad8083
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install zmk-next-messages Python deps
        run: python3 -m pip install -r zmk-next-messages/requirements-dev.txt
      - name: Run tests
        working-directory: zmk-next-configurator
        env:
          MESSAGES: ${{ github.workspace }}/zmk-next-messages
          PYTHON: python3
        run: |
          for f in tests/test_*.mjs; do
            echo "== $f =="
            node "$f"
          done
