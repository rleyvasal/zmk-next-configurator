name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # `if:` can't reference `secrets` directly, so thread it through env first.
      HAS_MESSAGES_TOKEN: ${{ secrets.MESSAGES_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zmk-next-configurator
      - uses: actions/checkout@v4
        if: ${{ env.HAS_MESSAGES_TOKEN == 'true' }}
        with:
          repository: rleyvasal/zmk-next-messages
          token: ${{ secrets.MESSAGES_REPO_TOKEN }}
          path: zmk-next-messages
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        if: ${{ env.HAS_MESSAGES_TOKEN == 'true' }}
        with:
          python-version: "3.11"
      - name: Install protoc
        if: ${{ env.HAS_MESSAGES_TOKEN == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install zmk-next-messages Python deps
        if: ${{ env.HAS_MESSAGES_TOKEN == 'true' }}
        run: python3 -m pip install -r zmk-next-messages/requirements-dev.txt
      - name: Run tests
        working-directory: zmk-next-configurator
        env:
          MESSAGES: ${{ github.workspace }}/zmk-next-messages
          PYTHON: python3
        run: |
          for f in tests/test_*.mjs; do
            echo "== $f =="
            node "$f"
          done
